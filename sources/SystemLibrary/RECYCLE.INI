[Library]
Name=NewSoft Recycle Bin & Quota Manager Dynamic Library
Filename=RECYCLE.DLL
Version=1.0.0
Author=Newspoint Software - NewSoft
Type=SystemLibrary
Subsystem=VFS_RecycleBin_Quota
Architecture=x86_64
Signed=1
EntryOffset=64

[Capabilities]
RecycleBinStorage=C:\Recycle.Bin
IndexDatabase=C:\Recycle.Bin\RECYCLE.IDX
ConfigFile=C:\Recycle.Bin\RECYCLE.CFG
SpaceLimitQuota=1
SuggestDirectDeleteOnQuotaExceeded=1
BypassRecycleBinOption=1
AutoPurgeOldestOption=1

[Defaults]
LimitPreset=1
MaxSizeBytes=1024
SuggestDirectOnQuota=1
BypassRecycleBin=0
ConfirmDelete=1
AutoCleanOldest=0

